name: Verify and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courseplan-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r scripts/planner-requirements.txt
      - run: npm test
      - run: npm run test:pathways
        env:
          COURSEPLAN_PLANNER_PYTHON: python
      - run: npm run lint:workspace
      - run: npm run build
      - run: npm run typecheck
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-build/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
